name: Baseline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: R10 baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential binutils gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-system-arm python3
          dpkg-query -W gcc gcc-aarch64-linux-gnu binutils binutils-aarch64-linux-gnu qemu-system-arm python3
      - name: Check ELF symbol reader with localized headers
        run: python3 scripts/test_elf_symbols.py
      - name: Check A0 stock container integrity and offline execution refusals
        run: |
          python3 scripts/test_capture_a0.py
          python3 scripts/test_capture_a0_kmi.py
          python3 scripts/test_capture_a0_repack.py
          python3 scripts/test_capture_a0_modules.py
          python3 scripts/test_capture_a0_build.py
      - name: Check static pre-copy witness refusals
        run: python3 scripts/test_lk_precopy_measurement.py
      - name: Check embedded AVB key format and consumer decoding
        run: python3 scripts/test_lk_embedded_key.py
      - name: Check AVB key-trust callback bindings
        run: python3 scripts/test_lk_avb_trust.py
      - name: Check AVB signature tables and bounded dispatch decoding
        run: python3 scripts/test_lk_avb_signature.py
      - name: Check AVB wrapper immediates and direct reference decoding
        run: python3 scripts/test_lk_avb_boot.py
      - name: Check Build-id cache binding and operand refusals
        run: python3 scripts/test_lk_build_id.py
      - name: Check Samsung selector names and request fields
        run: python3 scripts/test_lk_samsung_checks.py
      - name: Check RPMB dispatch tables and MAC request bindings
        run: python3 scripts/test_lk_rpmb.py
      - name: Check LK RPMB callback registration and SCSI operand bindings
        run: python3 scripts/test_lk_rpmb_transport.py
      - name: Check LK UFS completion snapshots and response status bindings
        run: python3 scripts/test_lk_ufs_completion.py
      - name: Check LK UFS host allocation and DMA address bindings
        run: python3 scripts/test_lk_ufs_host.py
      - name: Check LK heap page-pool bindings and arithmetic
        run: python3 scripts/test_lk_heap.py
      - name: Check LK pool MMU bindings and bounded table walks
        run: python3 scripts/test_lk_pool_mmu.py
      - name: Check inherited LK granule and build the QEMU state fixture
        run: |
          python3 scripts/test_lk_entry_granule.py
          make -C r8 USE_SYSTEM_TOOLS=1 BUILD=build/entry-state-ci build/entry-state-ci/lk_entry_state.bin
      - name: Check LK UFS IOCC branches and pinned DTS reference parsing
        run: |
          python3 scripts/test_lk_ufs_iocc.py
          python3 scripts/test_flop_ufs_iocc.py
      - name: Check DMC magic publisher and ACPM reference contracts
        run: |
          python3 scripts/test_newtime_dmc_magic.py
          python3 scripts/test_flop_acpm_reference.py
      - name: Check offline RPMB frames and pinned-source layout probe
        run: |
          python3 scripts/test_rpmb_frame.py
          python3 scripts/test_flop_reference.py
      - name: Build and validate the required baseline
        run: python3 scripts/validate_baseline.py --system-tools --output-dir build/baseline-ci
      - name: Preserve logs and summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/baseline-ci/*.log
            build/baseline-ci/summary.json
          if-no-files-found: warn
          retention-days: 14
